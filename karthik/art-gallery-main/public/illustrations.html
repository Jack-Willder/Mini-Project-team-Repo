<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Illustrations - ArtWave</title>
    <link rel="stylesheet" href="illustrations.css">
</head>

<body>
    <div class="title">
        <h1>Illustrations</h1>
        <a href="categories.html" class="back-btn"> Back</a>
    </div>

    <!-- Gallery Container -->
    <div class="content">
        <div class="gallery">
            <!-- Artworks will load here -->
        </div>
    </div>

    <script>
        const BASE_URL = "http://localhost:3000";
        const CATEGORY_ID = 4; // ✅ Digital Illustration category ID

        async function loadGallery() {
            try {
                const res = await fetch(`${BASE_URL}/arts/category/${CATEGORY_ID}`);
                const arts = await res.json();

                const galleryDiv = document.querySelector(".gallery");
                galleryDiv.innerHTML = "";

                if (arts.length === 0) {
                    galleryDiv.innerHTML = "<h2>No digital illustrations available yet.</h2>";
                    return;
                }

                arts.forEach((art) => {
                    const card = document.createElement("div");
                    card.classList.add("card");
                    card.innerHTML = `
            <img src="${BASE_URL}/uploads/${art.image}" alt="${art.title}">
            <h3>${art.title}</h3>
            <p>Artist: ${art.artist_name}</p>
            <p>₹${art.price}</p>
            <a href="view_art.html?id=${art.id}" class="view-btn">View</a>
          `;
                    galleryDiv.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading digital illustrations:", err);
            }
        }

        window.addEventListener("DOMContentLoaded", loadGallery);
    </script>
</body>

</html>
