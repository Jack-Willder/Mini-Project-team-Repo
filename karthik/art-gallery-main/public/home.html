<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery</title>
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="cart-icon.css" /> <!-- 🎨 new css only for cart feature -->

    <style>
        /* --- Header & User Button Styles --- */
        .header-actions {
            display: flex;
            align-items: center;
        }

        .user-btn {
            display: none;
            align-items: center;
            margin-left: 10px;
            background-color: #a963d1;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .user-btn:hover {
            background-color: #8a43ba;
        }

        .user-btn img.user-icon {
            margin-right: 5px;
            height: 20px;
            width: 20px;
        }

        .header-actions input {
            padding: 5px;
            margin-right: 5px;
        }

        .header-actions button {
            border: none;
            background: none;
            cursor: pointer;
        }

        /* ===============================
   Cart Icon Button Styles
   =============================== */

        .cart-icon-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            padding: 6px;
            transition: all 0.2s ease-in-out;
        }

        .cart-icon-btn img {
            width: 30px;
            height: 30px;
            filter: brightness(0) saturate(100%) invert(28%) sepia(74%) saturate(360%) hue-rotate(220deg) brightness(20%) contrast(95%);
        }

        /* Hover effect */
        .cart-icon-btn:hover {
            background: #a963d1;
        }

        .cart-icon-btn:hover img {
            filter: brightness(0) invert(1);
        }

        /* When added to cart */
        .cart-icon-btn.added {
            background: #a963d1;
        }

        .cart-icon-btn.added img {
            filter: brightness(0) invert(1);
        }

        /* To ensure image container is positioned properly */
        .img-container {
            position: relative;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="title">
        <h1 id="art">ART</h1>
        <h1 id="wave">WAVE</h1>
    </div>

    <!-- Header -->
    <div class="header">
        <ul id="menus">
            <li><a href="home.html">Home</a></li>
            <li><a href="aboutus.html">About us</a></li>
            <li><a href="artists.html">Artist</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li class="dropdown" id="loginMenu">
                <a href="#" tabindex="0">Login</a>
                <ul class="dropdown-menu">
                    <li><a href="user_login.html">User Login</a></li>
                    <li><a href="artist_login.html">Artist Login</a></li>
                    <li><a href="admin_login.html">Admin Login</a></li>
                </ul>
            </li>
        </ul>

      
            <a href="user_dashboard.html" class="user-btn" id="userDashboardBtn">
                <img src="images/user (1).png" alt="User Icon" class="user-icon" />
                <span id="userNameText">You</span>
            </a>
        </div>
    </div>

    <!-- Gallery Content -->
    <div class="content">
        <div class="gallery"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="call">
            <img id="call-img" src="images/phone-call.png" width="30px" height="30px" />
            <h3 id="contact">Contact - 8015575048</h3>

            <img id="insta-img" src="images/instagram.png" width="30px" height="30px" />
            <img id="fb-img" src="images/facebook.png" width="30px" height="30px" />
            <img id="X-img" src="images/twitter.png" width="30px" height="30px" />
        </div>

        <div class="mailid">
            <img id="gmail-img" src="images/gmail.png" width="30px" height="30px" />
            <h3>artwave@gmail.com</h3>
        </div>

        <div class="copyright">
            <h2 id="font">Art Wave</h2>
            <h4>© Copyrights 2025</h4>
        </div>
    </div>

    <script>
        const BASE_URL = "http://localhost:3000";

        if (window.location.search.includes("logout")) {
            sessionStorage.clear();
            localStorage.clear();
            console.log("✅ Cache cleared after logout");
        }

        // 🖼️ Load all arts
        async function loadGallery() {
            try {
                const res = await fetch(`${BASE_URL}/arts/all`);
                const arts = await res.json();

                const artGrid = document.querySelector(".gallery");
                artGrid.innerHTML = "";

                arts.forEach((art) => {
                    const artDiv = document.createElement("div");
                    artDiv.className = "card";
                    artDiv.innerHTML = `
            <div class="img-container">
              <img src="${BASE_URL}/uploads/${art.image}" alt="${art.artist_name}">
            </div>
            <h3>Artist: ${art.artist_name}</h3>
            <a href="view_art.html?id=${art.id}" class="view-btn">View</a>
          `;
                    artGrid.appendChild(artDiv);
                });
            } catch (err) {
                console.error("Error loading gallery:", err);
            }
        }

        // 👤 Update header login state
        async function updateHeader() {
            const loginMenu = document.getElementById("loginMenu");
            const userBtn = document.getElementById("userDashboardBtn");
            const nameSpan = document.getElementById("userNameText");

            try {
                const res = await fetch(`${BASE_URL}/users/dashboard`, {
                    method: "GET",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" }
                });

                const data = await res.json().catch(() => null);
                if (res.ok && data && data.user) {
                    loginMenu.style.display = "none";
                    userBtn.style.display = "inline-flex";
                    nameSpan.textContent = `Hi, ${data.user.username}`;
                } else {
                    loginMenu.style.display = "inline-flex";
                    userBtn.style.display = "none";
                }
            } catch (err) {
                console.error("Error checking login status:", err);
                loginMenu.style.display = "inline-flex";
                userBtn.style.display = "none";
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadGallery();
            updateHeader();
        });
    </script>
</body>

</html>
