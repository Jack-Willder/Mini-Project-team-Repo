<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="home.css" />
    <title>Art Gallery</title>
</head>

<body>
    <div class="title">
        <h1 id="art">ART</h1>
        <h1 id="wave">WAVE</h1>
    </div>
    <div class="header">
        <ul id="menus">
            <li><a href="home.html"> Home</a></li>
            <li><a href="aboutus.html">About us</a></li>
            <li><a href="artists.html"> Artist</a></li>
            <li><a href="categories.html"> Categories</a></li>
            <li class="dropdown">
                <a href="#" tabindex="0">Login</a>
                <ul class="dropdown-menu">
                    <li><a href="user_login.html">User Login</a></li>
                    <li><a href="artist_login.html">Artist Login</a></li>
                    <li><a href="admin_login.html">Admin Login</a></li>
                </ul>
            </li>
        </ul>
        <div>
            <input type="text" placeholder="Search">
            <button id="search-btn" type="submit"><img src="images/magnifying-glass.png" height="20px"
                    width="20px"></button>
        </div>
           
    </div>
    <div class="content">
        <div class="gallery">
            <div class="card">

            </div>

        </div>

        <div class="footer">
            <div class="call">
                <img id="call-img" src="images/phone-call.png" width="30px" height="30px">
                <h3 id="contact">Contact - 8015575048</h3>

                <img id="insta-img" src="images/instagram.png" width="30px" height="30px">
                <img id="fb-img" src="images/facebook.png" width="30px" height="30px">
                <img id="X-img" src="images/twitter.png" width="30px" height="30px">

            </div>
            <div class="mailid">
                <img id="gmail-img" src="images/gmail.png" width="30px" height="30px">
                <h3>artwave@gmail.com</h3>
            </div>
            <div class="copyright">
                <img id="cp-img" src="images/copyright.png" width="30px" height="30px">
                <h3 id="cp">Copyrights 2025 </h3>
            </div>
        </div>

      </div>

        <script>
            fetch('/arts/all')
                .then(res => res.json())
                .then(arts => {
                    const artGrid = document.querySelector('.gallery');
                    artGrid.innerHTML = ''; // clear old data if any

                    arts.forEach(art => {
                        const artDiv = document.createElement('div');
                        artDiv.className = 'card';
                        artDiv.innerHTML = `
          <img src="/uploads/${art.image}" alt="${art.artist_name}">
          <h3>Artist: ${art.artist_name}</h3>
          <!-- Send the art id in the URL -->
          <a href="view_art.html?id=${art.id}" class="view-btn">View</a>
        `;
                        artGrid.appendChild(artDiv);
                    });
                })
                .catch(err => console.error(err));
        </script>

</body>

</html>
