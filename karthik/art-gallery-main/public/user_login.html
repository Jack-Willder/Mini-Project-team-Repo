<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Art Gallery</title>
    <link rel="stylesheet" href="user_login.css">
</head>

<body>
    <div class="title">
        <h1>Login</h1>
        <a href="home.html" class="back-button">Back</a>
    </div>

    <div class="login-box">
        <h2>User Login</h2>

        <!-- 👇 keep same layout, but remove normal form submission -->
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="off" placeholder="Enter email" required>
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit">Login</button>

            <p class="reg-link">
                New User? <a href="user_register.html">Register here</a>
            </p>
        </form>
    </div>

    <script>
        // 🟢 Handle form submit using JS (not normal POST)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // stop page reload

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('http://localhost:3000/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // ✅ allow session cookie
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    // ✅ redirect to homepage
                    window.location.href = '/home.html';
                } else {
                    alert(data.message || '⚠️ Login failed, please check your details.');
                }

            } catch (err) {
                console.error('Login error:', err);
                alert('❌ Server error. Please try again later.');
            }
        });
    </script>
</body>

</html>
