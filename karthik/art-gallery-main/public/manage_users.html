<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link rel="stylesheet" href="manage_users.css">
</head>

<body>
    <div class="sidebar">
        <h2>Admin </h2>
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="#" class="active">Manage Users</a>
        <a href="manage_artists.html">Manage Artists</a>
        <a href="manage_arts.html">Manage Arts</a>
        
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manage Users</h1>
            <p>ART WAVE</p>
        </div>

        <div class="table-container">
            <table id="userTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // Load all users
        async function loadUsers() {
            try {
                const res = await fetch('http://localhost:3000/users', {
                    credentials: 'include'
                });
                const data = await res.json();

                const tbody = document.querySelector('#userTable tbody');
                tbody.innerHTML = '';

                data.forEach(user => {
                    const row = `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td>
                                <button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error(err);
                alert('❌ Failed to load users');
            }
        }

        // Delete user
        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;

            try {
                const res = await fetch(`http://localhost:3000/users/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                const msg = await res.json();
                if (msg.message) alert(msg.message);
                else if (msg.error) alert('❌ Error: ' + msg.error);
                else alert('❌ Unknown response from server');

                loadUsers();
            } catch (err) {
                console.error(err);
                alert('❌ Network or server error');
            }
        }

        loadUsers();
    </script>
</body>

</html>
