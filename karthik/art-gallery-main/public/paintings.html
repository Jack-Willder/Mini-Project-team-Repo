<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paintings - ArtWave</title>
    <link rel="stylesheet" href="paintings.css">
</head>

<body>
    <div class="title">
        <h1>Paintings</h1>
        <a href="categories.html" class="back-btn"> Back</a>
    </div>

    <section class="content">
        <div class="gallery" id="paintings-gallery"></div>
    </section>

    <script>
        const BASE_URL = "http://localhost:3000";
        const categoryId = 1; // ✅ Paintings category ID

        async function loadPaintings() {
            try {
                const res = await fetch(`${BASE_URL}/arts/category/${categoryId}`);
                const arts = await res.json();
                const gallery = document.getElementById("paintings-gallery");
                gallery.innerHTML = "";

                if (arts.length === 0) {
                    gallery.innerHTML = `<p style="text-align:center;">No paintings available at the moment.</p>`;
                    return;
                }

                arts.forEach(art => {
                    const card = document.createElement("div");
                    card.classList.add("card");
                    card.innerHTML = `
            <img src="${BASE_URL}/uploads/${art.image}" alt="${art.title}">
            <h3>${art.title}</h3>
            <p>Artist: ${art.artist_name}</p>
            <p>₹${art.price}</p>
            <a href="view_art.html?id=${art.id}" class="view-btn">VIEW</a>
          `;
                    gallery.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading paintings:", err);
            }
        }

        window.addEventListener("DOMContentLoaded", loadPaintings);
    </script>

</body>

</html>
