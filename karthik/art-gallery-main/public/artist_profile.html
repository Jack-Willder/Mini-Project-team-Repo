<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" href="artist_profile.css">
</head>

<body>
    <div class="title">
        <a href="artist_dashboard.html" class="back-btn">Back</a>
        <h1>Artist Profile</h1>
    </div>
    <div class="profile-container">
        <!-- Artist Profile Card -->
        <div class="artist-info-card">
            <img id="profileImage" src="default.jpg" alt="Profile Image">
            <h2 id="artistName">Artist Name</h2>
            <p id="artistBio">Artist bio will appear here...</p>
        </div>

        <h3>My Artworks</h3>
        <div class="gallery" id="artworksContainer">

        </div>
    </div>

    <script>
        async function loadProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const artistId = urlParams.get("id");

            // If artistId exists → show public profile, else show logged-in artist
            const endpoint = artistId ? `/artists/${artistId}` : `/artists/me`;

            const response = await fetch(endpoint);
            if (!response.ok) {
                alert("❌ Failed to load profile");
                return;
            }

            const data = await response.json();
            const artist = data.artist;

            document.getElementById("profileImage").src = artist.profile_image || "default.jpg";
            document.getElementById("artistName").textContent = artist.name || artist.username;
            document.getElementById("artistBio").textContent = artist.bio || "No bio yet.";

            const artworksContainer = document.getElementById("artworksContainer");
            artworksContainer.innerHTML = "";

            data.artworks.forEach(art => {
                artworksContainer.innerHTML += `
                    <div class="card">
                        <img src="/uploads/${art.image}" alt="${art.title}">
                        <h3>${art.title}</h3>
                    </div>
                `;
            });
        }

        loadProfile();
    </script>

</body>

</html>
